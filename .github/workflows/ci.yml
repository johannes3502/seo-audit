name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile scripts/repo_scan.py scripts/seo_scan.py scripts/gsc_quick_wins.py scripts/validate_skill.py
      - name: Validate skill
        run: python scripts/validate_skill.py .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
